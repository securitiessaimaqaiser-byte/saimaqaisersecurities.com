<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 — Page Not Found | Saima Qaiser Securities</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="description" content="The page you are looking for could not be found. Return to Saima Qaiser Securities homepage." />

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/reset.css" />
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/animations.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />

  <!-- Font -->
  <link rel="stylesheet" href="/assets/fonts/inter/inter.css" />
</head>

<body>

  <!-- Page Loader -->
  <div id="pageLoader" class="page-loader">
    <span class="loader-spinner" aria-hidden="true"></span>
  </div>

  <!-- Main Content -->
  <main class="error-page" data-animate="fade">

    <div class="error-container">

      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page Not Found</h2>

      <p class="error-text">
        The page you are trying to access does not exist or may have been moved.
      </p>

      <div class="error-actions">
        <a href="/" class="btn-primary">Go to Homepage</a>
        <a href="/index.html#contact" class="btn-secondary">Contact Support</a>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Saima Qaiser Securities. All rights reserved.</p>
  </footer>

  <!-- JS -->
  <script src="/assets/js/loader.js"></script>
  <script src="/assets/js/animations.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
